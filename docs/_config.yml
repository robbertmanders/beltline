# The documentation site, published by GitHub Pages from this folder on main
# (https://robbertmanders.github.io/beltline/). The pages are plain Markdown and read
# on GitHub too; the front matter only places them in the site's navigation.
title: Beltline
description: Turn GitHub issues, pull request reviews and Jira tickets into pull requests, with the coding agents you already have.
url: https://robbertmanders.github.io
baseurl: /beltline
lang: en
# The picture link previews show (jekyll-seo-tag), also the repository's social preview.
image: /images/social-preview.png

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: false

color_scheme: beltline
search_enabled: true
search:
  heading_level: 3
  button: true
heading_anchors: true
enable_copy_code_button: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  GitHub: https://github.com/robbertmanders/beltline
aux_links_new_tab: false

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/robbertmanders/beltline
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

footer_content: Beltline is licensed under the <a href="https://github.com/robbertmanders/beltline/blob/main/LICENSE">Apache License 2.0</a>.

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

exclude:
  - "*.sh"
